<svg xmlns="http://www.w3.org/2000/svg" viewBox="5 5 90 90" width="90" height="90"
     role="img" aria-label="Prox">
  <!--
    Símbolo do Prox: um chevron navy (">") e duas cunhas ciano que fecham o X.
    Usado nos espaços pequenos — favicon, aba do navegador, barra de endereço,
    ícone do app instalado. Para espaços maiores use a assinatura completa
    (PRO + este símbolo), montada no CSS em .brand.

    Em abas escuras o navy sumiria, então ele clareia via prefers-color-scheme.
  -->
  <style>
    .navy { fill: #0e2260; }
    .cyan { fill: #17b8d4; }
    @media (prefers-color-scheme: dark) {
      .navy { fill: #e9eefa; }
    }
  </style>

  <path class="navy" d="M10.4 14.8H32l28.8 34.4L32 83.6H10.4l28.8-34.4z"/>
  <path class="cyan" d="M68 14.8h21.6L63.41 46.08 52.61 33.18z"/>
  <path class="cyan" d="M68 83.6h21.6L63.41 52.32 52.61 65.22z"/>
</svg>
